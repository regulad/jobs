# Applies jobs/ to Jenkins at https://ci.regulad.xyz/ at each push to main:
# seed/apply.sh writes the seed job from seed/config.xml and builds it at the
# pushed commit. It signs in as svc-jobs, whose name and password are this
# repository's secrets, set by regulad/homelab's tofu/github.
name: seed

on:
  push:
    branches: [main]
  workflow_dispatch:

# One at a time, in push order: each build applies its own commit.
concurrency:
  group: seed
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  seed:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Write and build the seed
        env:
          JENKINS_URL: https://ci.regulad.xyz
          JENKINS_USER: ${{ secrets.JENKINS_USER }}
          JENKINS_PASSWORD: ${{ secrets.JENKINS_PASSWORD }}
          COMMIT: ${{ github.sha }}
        run: seed/apply.sh
