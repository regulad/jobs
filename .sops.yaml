# Files named *.sops.<json|yaml|yml|env> are encrypted to these age recipients:
# Parker's own key, and a key made only for this repository's Jenkins jobs,
# whose identity Jenkins holds as a credential.
# Decrypt with `sops decrypt <file>`; the matching identity lives in the sops
# age keys file, never in git.
creation_rules:
  - path_regex: \.sops\.(json|ya?ml|env)$
    age: >-
      age14e7wj4lltcvva2jy9vzzul8y7yuj5xk9vtqfxt9erzz58xqwmpjqurdhep,
      age1h9vt20vc3rxf58wc5ag6wmvktpklxdppvw9d0stndf8q6qmzm57qlryj0u
